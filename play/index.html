<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>言語化トレーニング</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --paper: #fffdf8;
      --ink: #222222;
      --muted: #66615b;
      --line: #d8d1c7;
      --accent: #8b5e34;
      --accent-light: #f2e8dc;
      --danger: #a33a2b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family:
        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
    }

    button, textarea { font: inherit; }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
      background: var(--paper);
    }

    .app-header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .app-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .app-main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px 64px;
      flex: 1;
    }

    .screen {
      width: 100%;
    }

    .top-screen {
      max-width: 720px;
      margin: 0 auto;
    }

    .screen-heading {
      margin-bottom: 12px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.45;
      font-weight: 700;
    }

    .screen-description {
      color: var(--muted);
      line-height: 1.9;
      margin-bottom: 36px;
    }

    .category-list {
      display: grid;
      gap: 12px;
    }

    .category-button {
      width: 100%;
      min-height: 64px;
      padding: 14px 20px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }

    .category-button:hover,
    .category-button:focus-visible {
      background: var(--ink);
      color: var(--paper);
      outline: none;
    }

    .training-screen {
      max-width: 820px;
      margin: 0 auto;
    }

    .topic-label {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: .95rem;
    }

    .topic {
      margin: 0 0 30px;
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      line-height: 1.5;
      font-weight: 700;
    }

    .countdown-wrap {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
      margin-bottom: 30px;
      text-align: center;
    }

    .countdown {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .countdown-caption {
      margin-top: 4px;
      color: var(--muted);
      font-size: .9rem;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .remaining-time {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .field {
      margin-bottom: 26px;
    }

    .field.is-hidden {
      display: none;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .field-note {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 10px;
    }

    .input-area {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      padding: 14px 16px;
      line-height: 1.8;
      outline: none;
    }

    .input-area:focus {
      border-color: var(--ink);
    }

    .status-message {
      min-height: 24px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: .9rem;
    }

    .result-screen {
      max-width: 720px;
      margin: 0 auto;
    }

    .result-topic {
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      font-size: 1.35rem;
      line-height: 1.7;
      font-weight: 700;
    }

    .result-list {
      margin: 0 0 36px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .result-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .result-unit {
      color: var(--muted);
      margin-left: 4px;
      font-size: .9rem;
      font-weight: 400;
    }

    .primary-button {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }

    .primary-button:hover,
    .primary-button:focus-visible {
      background: #3a3a3a;
      outline: none;
    }

    .secondary-button {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .secondary-button:hover,
    .secondary-button:focus-visible {
      background: #f0ece6;
      outline: none;
    }

    .saving-message {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 575.98px) {
      .app-main {
        padding-top: 32px;
      }

      .result-item {
        align-items: center;
      }
    }
  </style>
</head>

<body>
<div id="app" class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">
      <p class="app-title">言語化トレーニング</p>
    </div>
  </header>

  <main class="app-main">
    <!-- TOP -->
    <section v-if="screen === 'top'" class="screen top-screen">
      <h1 class="screen-heading">言語化トレーニング</h1>
      <p class="screen-description">
        自分の考えを短時間で整理し、理由まで言葉にするトレーニングです。<br>
        対象を選んで始めてください。
      </p>

      <div class="category-list">
        <button
          v-for="category in categories"
          :key="category.id"
          class="category-button"
          type="button"
          @click="startTraining(category)"
        >
          {{ category.label }}
        </button>
      </div>
    </section>

    <!-- TRAINING -->
    <section v-else-if="screen === 'training'" class="screen training-screen">
      <p class="topic-label">お題</p>
      <h1 class="topic">{{ currentQuestion.text }}</h1>

      <div v-if="phase === 'countdown'" class="countdown-wrap" aria-live="assertive">
        <p class="countdown">{{ countdown }}</p>
        <p class="countdown-caption">まもなく開始します</p>
      </div>

      <template v-else>
        <div class="timer-row" aria-live="polite">
          <span>残り時間</span>
          <span class="remaining-time">{{ formattedRemainingTime }}</span>
        </div>

        <div class="field">
          <label class="field-label" for="thought">あなたの考え</label>
          <p class="field-note">お題について思ったことを自由に書いてください。</p>
          <textarea
            id="thought"
            ref="thoughtInput"
            v-model="answers.thought"
            class="input-area"
            rows="7"
            maxlength="5000"
            :disabled="phase !== 'running'"
            placeholder="あなたの考えを書いてください"
          ></textarea>
        </div>

        <div class="field" :class="{ 'is-hidden': !showReason }">
          <label class="field-label" for="reason">その理由</label>
          <p class="field-note">なぜそう考えたのかを書いてください。</p>
          <textarea
            id="reason"
            v-model="answers.reason"
            class="input-area"
            rows="7"
            maxlength="5000"
            :disabled="phase !== 'running'"
            placeholder="理由を書いてください"
          ></textarea>
        </div>

        <p class="status-message">{{ saveError }}</p>
      </template>
    </section>

    <!-- RESULT -->
    <section v-else class="screen result-screen">
      <h1 class="screen-heading">結果</h1>

      <div class="result-topic">{{ currentQuestion.text }}</div>

      <div class="result-list">
        <div class="result-item">
          <span>思考入力文字数</span>
          <span class="result-value">
            {{ result.thoughtLength }}<span class="result-unit">文字</span>
          </span>
        </div>
        <div class="result-item">
          <span>理由入力文字数</span>
          <span class="result-value">
            {{ result.reasonLength }}<span class="result-unit">文字</span>
          </span>
        </div>
      </div>

      <button class="secondary-button" type="button" @click="goTop">
        TOPへ戻る
      </button>

      <p v-if="saving" class="saving-message">入力内容を保存しています。</p>
      <p v-else-if="saveCompleted" class="saving-message">入力内容を保存しました。</p>
      <p v-else-if="saveError" class="saving-message">{{ saveError }}</p>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.8.4/dist/axios.min.js"></script>
<script>
const { createApp, nextTick } = Vue;

/*
 * Googleスプレッドシート保存先。
 * Google Apps ScriptをWebアプリとして公開したURLを設定してください。
 * 未設定の場合でもアプリ自体は動作し、保存処理だけスキップします。
 */
const GOOGLE_SHEETS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwWinJjXhLIdgN9GHZ3jSmE61P6CjFbW3RNVh0jfa4uBEMsJnq1RL1S5aPu3QJSzlGa/exec';

createApp({
  data() {
    return {
      screen: 'top',
      phase: 'idle',
      countdown: 3,
      remainingSeconds: 120,
      countdownTimer: null,
      trainingTimer: null,
      reasonTimer: null,
      currentCategory: null,
      currentQuestion: null,
      answers: {
        thought: '',
        reason: ''
      },
      result: {
        thoughtLength: 0,
        reasonLength: 0
      },
      saving: false,
      saveCompleted: false,
      saveError: '',
      categories: [
        { id: 'junior', label: '小学生～中学生用' },
        { id: 'high', label: '高校生用' },
        { id: 'university', label: '大学生用' },
        { id: 'adult', label: '社会人用' }
      ],
      questions: {
        junior: [
          { id: 'boss-good-01', text: '良い上司とはどんな上司か' }
        ],
        high: [
          { id: 'boss-good-01', text: '良い上司とはどんな上司か' }
        ],
        university: [
          { id: 'boss-good-01', text: '良い上司とはどんな上司か' }
        ],
        adult: [
          { id: 'boss-good-01', text: '良い上司とはどんな上司か' }
        ]
      }
    };
  },

  computed: {
    showReason() {
      return this.phase === 'running' && this.remainingSeconds <= 60;
    },

    formattedRemainingTime() {
      const minutes = Math.floor(this.remainingSeconds / 60);
      const seconds = this.remainingSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
  },

  methods: {
    startTraining(category) {
      this.clearTimers();

      this.currentCategory = category;
      const questionList = this.questions[category.id] || [];
      this.currentQuestion = questionList[Math.floor(Math.random() * questionList.length)];

      this.answers.thought = '';
      this.answers.reason = '';
      this.result.thoughtLength = 0;
      this.result.reasonLength = 0;
      this.remainingSeconds = 120;
      this.countdown = 3;
      this.saveCompleted = false;
      this.saveError = '';
      this.screen = 'training';
      this.phase = 'countdown';

      this.countdownTimer = setInterval(() => {
        this.countdown -= 1;

        if (this.countdown <= 0) {
          clearInterval(this.countdownTimer);
          this.countdownTimer = null;
          this.beginTraining();
        }
      }, 1000);
    },

    beginTraining() {
      this.phase = 'running';

      nextTick(() => {
        this.$refs.thoughtInput?.focus();
      });

      this.trainingTimer = setInterval(() => {
        this.remainingSeconds -= 1;

        if (this.remainingSeconds <= 0) {
          this.remainingSeconds = 0;
          this.finishTraining();
        }
      }, 1000);
    },

    finishTraining() {
      if (this.phase !== 'running') return;

      this.clearTimers();
      this.phase = 'finished';

      this.result.thoughtLength = Array.from(this.answers.thought).length;
      this.result.reasonLength = Array.from(this.answers.reason).length;

      this.screen = 'result';
      this.saveResult();
    },

    async saveResult() {
      this.saving = true;
      this.saveCompleted = false;
      this.saveError = '';

      if (!GOOGLE_SHEETS_ENDPOINT) {
        this.saving = false;
        return;
      }

      const payload = {
        recordedAt: new Date().toISOString(),
        category: this.currentCategory?.label || '',
        questionId: this.currentQuestion?.id || '',
        question: this.currentQuestion?.text || '',
        thought: this.answers.thought,
        reason: this.answers.reason,
        thoughtLength: this.result.thoughtLength,
        reasonLength: this.result.reasonLength
      };

      try {
        await axios.post(GOOGLE_SHEETS_ENDPOINT, payload, {
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          }
        });
        this.saveCompleted = true;
      } catch (error) {
        console.error(error);
        this.saveError = '入力内容の保存に失敗しました。結果は表示しています。';
      } finally {
        this.saving = false;
      }
    },

    goTop() {
      this.clearTimers();
      this.screen = 'top';
      this.phase = 'idle';
      this.currentCategory = null;
      this.currentQuestion = null;
      this.answers.thought = '';
      this.answers.reason = '';
    },

    clearTimers() {
      if (this.countdownTimer) {
        clearInterval(this.countdownTimer);
        this.countdownTimer = null;
      }

      if (this.trainingTimer) {
        clearInterval(this.trainingTimer);
        this.trainingTimer = null;
      }

      if (this.reasonTimer) {
        clearTimeout(this.reasonTimer);
        this.reasonTimer = null;
      }
    }
  },

  beforeUnmount() {
    this.clearTimers();
  }
}).mount('#app');
</script>
</body>
</html>
